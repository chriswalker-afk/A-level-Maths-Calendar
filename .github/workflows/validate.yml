name: Validate calendar
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install math validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/config.js
          node --check src/data/programmes.js
          node --check src/data/week01.js
      - name: Run content and MathJax typesetting tests
        run: npm test
